[project]
name = "deepmorph-orchestrator"
version = "0.1.0"
description = "Read-only MCP server for querying DeepMorph code knowledge graphs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorlog>=6.9.0",
    "httpx>=0.28.0",
    "mcp>=1.26.0",
    "neo4j>=6.1.0",
    "pyjwt[crypto]>=2.8.0",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
