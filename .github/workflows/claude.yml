name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read prompt file
        id: read-prompt
        run: |
          PROMPT_CONTENT=$(cat .github/workflows/claude-review-prompt.md)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$PROMPT_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build GitHub Context
        id: gh-context
        run: |
          if [[ "${{ github.event_name }}" == *"pull_request"* ]]; then
            {
              echo "content<<EOF"
              echo "Type: Pull Request"
              echo "Title: ${{ github.event.pull_request.title }}"
              echo "Author: ${{ github.event.pull_request.user.login }}"
              echo "Branch: ${{ github.event.pull_request.head.ref }} -> ${{ github.event.pull_request.base.ref }}"
              echo "State: ${{ github.event.pull_request.state }}"
              echo "Additions: ${{ github.event.pull_request.additions }}"
              echo "Deletions: ${{ github.event.pull_request.deletions }}"
              echo "Commits: ${{ github.event.pull_request.commits }}"
              echo "Changed Files: ${{ github.event.pull_request.changed_files }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

          elif [[ "${{ github.event_name }}" == *"issue"* ]]; then
            {
              echo "content<<EOF"
              echo "Type: Issue"
              echo "Title: ${{ github.event.issue.title }}"
              echo "Author: ${{ github.event.issue.user.login }}"
              echo "State: ${{ github.event.issue.state }}"
              echo "Number: #${{ github.event.issue.number }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read
          allowed_bots: "google-labs-jules"
          claude_args: |
            --append-system-prompt "Here is the guidelines:\n${{ steps.read-prompt.outputs.content }}"
          # Here is the context:\n${{ steps.gh-context.outputs.content }}\n\n

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr:*)'
